# Generic artifact lockfile for Konflux hermetic builds (cachi2/hermeto).
# Prefetches the Chrome for Testing binary used by Puppeteer.
#
# To compute the checksum:
#   curl -sL https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.47/linux64/chrome-linux64.zip \
#     | sha256sum
#
# When updating Chrome version, also update the Dockerfile extraction path
# (chrome/linux-<VERSION>) and the @puppeteer/browsers install command.
metadata:
  version: "1"
artifacts:
  - download_url: https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.47/linux64/chrome-linux64.zip
    checksum: "sha256:PLACEHOLDER_RUN_CURL_COMMAND_ABOVE"
    filename: chrome-linux64.zip
