# RPM lockfile input for Konflux hermetic builds.
# Lists RPM packages needed by the Dockerfile runtime stage.
#
# Generate the resolved rpms.lock.yaml using rpm-lockfile-prototype:
#   pip install rpm-lockfile-prototype  # requires python3-dnf system package
#   rpm-lockfile --image registry.access.redhat.com/ubi10/nodejs-22-minimal:10.2 \
#     --outfile rpms.lock.yaml rpms.in.yaml
#
# The builder stage does NOT need RPMs when building hermetically
# (native modules use prebuilt binaries via --ignore-scripts).
contentOrigin:
  type: repo-file
packages:
  # Chrome runtime dependencies (needed by Puppeteer headless Chrome)
  - name: bzip2
  - name: fontconfig
  - name: pango
  - name: libXcomposite
  - name: libXcursor
  - name: libXdamage
  - name: libXext
  - name: libXi
  - name: libXtst
  - name: cups-libs
  - name: libXrandr
  - name: alsa-lib
  - name: atk
  - name: gtk3
  - name: libdrm
  - name: mesa-libgbm
  - name: libxshmfence
  - name: nss
